name: ezllmtest

x-backend-environment: &backend-environment
  PYTHON_DOTENV_DISABLED: "1"
  DATABASE_URL: "mysql+pymysql://${MYSQL_USER:?set MYSQL_USER}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}?charset=utf8mb4"
  AGENT_REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
  ZHIPU_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  MOONSHOT_API_KEY: ""

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: ez_back_dev/Dockerfile
  image: ezllmtest/backend:0.1.0
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  environment: *backend-environment
  volumes:
    - project_files:/app/static/projects
  networks: [application, observability]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  frontend:
    build:
      context: .
      dockerfile: ez_front_dev/Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://127.0.0.1:8130
        VUE_APP_AGENT_API_BASE_URL: http://127.0.0.1:8131
        VUE_APP_GRAFANA_BASE_URL: http://127.0.0.1:3000
    image: ezllmtest/frontend:0.1.0
    restart: unless-stopped
    user: "nginx"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12

  legacy-api:
    <<: *backend-service
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8130"]
    ports: ["127.0.0.1:8130:8130"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8130/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 18

  agent-api:
    <<: *backend-service
    command: ["python", "-m", "app.agentApi", "--port", "8131"]
    ports: ["127.0.0.1:8131:8131"]
    environment:
      <<: *backend-environment
      AGENT_API_BIND_MODE: container
      AGENT_TELEMETRY_ENABLED: "true"
      AGENT_TELEMETRY_SERVICE_NAME: ezllm-agent-api
      AGENT_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8131/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 18

  worker:
    <<: *backend-service
    command: ["python", "-m", "app.agentWorker", "--consumer", "compose-worker"]
    environment:
      <<: *backend-environment
      AGENT_TELEMETRY_ENABLED: "true"
      AGENT_TELEMETRY_SERVICE_NAME: ezllm-agent-worker
      AGENT_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from redis import Redis; import sys; sys.exit(0 if Redis.from_url('redis://redis:6379/0').ping() else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 18

  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    configs:
      - source: mysql_schema
        target: /docker-entrypoint-initdb.d/001-schema.sql
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 24

  redis:
    image: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [application]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    networks: [observability]
    depends_on:
      tempo: { condition: service_started }
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks: [observability, application]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo.yaml
    volumes:
      - tempo_data:/var/tempo
    networks: [observability]
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana_agent_dashboard
        target: /var/lib/grafana/dashboards/agent-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [observability, application]
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 18

networks:
  application:
    internal: false
  observability:
    internal: true

volumes:
  mysql_data:
  redis_data:
  project_files:
  prometheus_data:
  tempo_data:
  grafana_data:

configs:
  mysql_schema:
    file: ./ezllmtest.sql
  otel_collector_config:
    file: ./ops/observability/otel-collector.yaml
  prometheus_config:
    file: ./ops/observability/prometheus.yaml
  tempo_config:
    file: ./ops/observability/tempo.yaml
  grafana_datasources:
    file: ./ops/observability/grafana/provisioning/datasources/datasources.yaml
  grafana_dashboards:
    file: ./ops/observability/grafana/provisioning/dashboards/dashboards.yaml
  grafana_agent_dashboard:
    file: ./ops/observability/grafana/dashboards/agent-overview.json
